# ============================================================
# nginx/voucher.conf — production reverse proxy for the Voucher_API
#
# Enforces TLS 1.2+ and redirects all plain HTTP to HTTPS (Req 6.12, 11.4,
# 11.5). Replace <yourdomain> and the certificate paths before use.
#
# Install (Debian/Ubuntu):
#   sudo cp nginx/voucher.conf /etc/nginx/sites-available/voucher.conf
#   sudo ln -s /etc/nginx/sites-available/voucher.conf \
#              /etc/nginx/sites-enabled/voucher.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Obtain certificates first with: sudo certbot --nginx -d <yourdomain>
# ============================================================

server {
    listen 443 ssl;
    server_name <yourdomain>;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /etc/letsencrypt/live/<yourdomain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<yourdomain>/privkey.pem;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name <yourdomain>;
    return 301 https://$host$request_uri;
}
