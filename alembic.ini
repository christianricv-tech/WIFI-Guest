# alembic.ini — Alembic configuration for the Aruba Voucher Backend
#
# env.py overrides sqlalchemy.url at runtime using DATABASE_URL from app.config,
# so the value below is only a placeholder and is never used directly.

[alembic]
# Path to the Alembic migration scripts directory
script_location = alembic

# Template for new migration files
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Maximum length of the slug portion of a file name
truncate_slug_length = 40

# Set to "true" to run the environment during the "revision" command,
# regardless of autogenerate.
revision_environment = false

# Migraiton output encoding
output_encoding = utf-8

# Placeholder — overridden at runtime by env.py using DATABASE_URL from app.config
sqlalchemy.url = postgresql+asyncpg://user:password@localhost/dbname


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
