# ============================================================
# freeradius/sql/postgresql.conf — rlm_sql module configuration
#
# TEMPLATE. Copy to /etc/freeradius/3.0/mods-available/sql and enable:
#   ln -s /etc/freeradius/3.0/mods-available/sql \
#         /etc/freeradius/3.0/mods-enabled/sql
#
# IMPORTANT: replace the placeholder connection values below.
#
# The rlm_sql path queries the radius_voucher_view (created by Alembic
# migration 004) to authorize a voucher WITHOUT updating its status (Req 10.4).
# Consumption is recorded separately by the FastAPI /radius/post-auth endpoint
# via the rest.post-auth call in the site's post-auth section.
#
# Caveat: this path has a TOCTOU race between the view query and the post-auth
# update. The rlm_rest path (SELECT ... FOR UPDATE) is preferred in production.
#
# Requirements: 10.3, 10.4
# ============================================================

sql {
    dialect = "postgresql"
    driver = "rlm_sql_postgresql"

    # --- Connection parameters (REPLACE THESE) ---
    server = "localhost"
    port = 5432
    login = "radius_user"
    password = "CHANGE_ME"
    radius_db = "voucher_db"

    # --- Authorization query ---
    # Reads from the view. Returns the password value plus the comparison
    # operator ('==') so rlm_sql can verify code == code. Only rows where the
    # view's is_valid flag is 1 are considered.
    authorize_check_query = "\
        SELECT password AS value, '==' AS op \
        FROM radius_voucher_view \
        WHERE username = '%{SQL-User-Name}' AND is_valid = 1 \
        LIMIT 1"

    # No RADIUS accounting tables are required.
    accounting = no

    # --- Connection pool ---
    pool {
        start = 5
        min = 4
        max = 10
        spare = 3
        uses = 0
        retry_delay = 30
        lifetime = 0
        idle_timeout = 60
    }
}
