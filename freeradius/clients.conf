# ============================================================
# freeradius/clients.conf — RADIUS client (Aruba AP) configuration
#
# TEMPLATE. Append the client block below to /etc/freeradius/3.0/clients.conf
# (or include this file) and restart FreeRADIUS.
#
# The AP management interface is https://192.168.101.253:4343 (Aruba Instant
# serves its web UI on port 4343). RADIUS itself is UDP 1812. The "secret"
# below MUST match the value entered in the AP's RADIUS server profile and the
# RADIUS_SHARED_SECRET environment variable in .env.
#
# Requirements: 10.6
# ============================================================

client aruba_ap {
    ipaddr    = 192.168.101.253
    secret    = 660fee95d97ec8a1a35f5aa841d921e4c8808f2cf02fc5f5
    shortname = aruba-ap-505
    # Optional: generous timeout/retry to tolerate AP retransmits.
    # require_message_authenticator = no
}
