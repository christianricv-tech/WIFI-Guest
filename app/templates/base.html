<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aruba Voucher Admin{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; color: #1f2933; background: #f5f7fa; }
    nav { background: #1f2a44; color: #fff; padding: 0.75rem 1.25rem; display: flex; gap: 1rem; align-items: center; }
    nav a { color: #dbe4ff; text-decoration: none; font-weight: 600; }
    nav a:hover { color: #fff; text-decoration: underline; }
    nav form { margin-left: auto; }
    nav button { background: #e5e7eb; border: 0; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: 600; }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.4rem; }
    table { border-collapse: collapse; width: 100%; background: #fff; }
    th, td { border: 1px solid #d2d6dc; padding: 0.45rem 0.6rem; text-align: left; font-size: 0.9rem; }
    th { background: #eef1f6; }
    .tag { padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.8rem; }
    .tag.unused { background: #d1fae5; }
    .tag.consumed { background: #dbeafe; }
    .tag.revoked { background: #fee2e2; }
    .tag.expired { background: #fef3c7; }
    form.inline { display: inline; }
    .filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; margin-bottom: 1rem; background:#fff; padding:1rem; border:1px solid #d2d6dc; }
    .filters label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.25rem; }
    input, select { padding: 0.35rem; border: 1px solid #cbd5e1; border-radius: 4px; }
    button.primary { background: #1f2a44; color: #fff; border: 0; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
    .pagination { margin-top: 1rem; display: flex; gap: 0.5rem; align-items: center; }
    .error { background: #fee2e2; border: 1px solid #fca5a5; padding: 0.6rem 0.8rem; border-radius: 4px; margin-bottom: 1rem; }
    .notice { background: #d1fae5; border: 1px solid #6ee7b7; padding: 0.6rem 0.8rem; border-radius: 4px; margin-bottom: 1rem; }
    textarea { width: 100%; min-height: 12rem; font-family: ui-monospace, Consolas, monospace; }
  </style>
</head>
<body>
  <nav>
    <a href="/admin/dashboard">Dashboard</a>
    <a href="/admin/vouchers/new">New Voucher</a>
    <a href="/admin/audit-logs/view">Audit Logs</a>
    <form method="post" action="/admin/logout/submit"><button type="submit">Logout</button></form>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
